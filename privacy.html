  .brand{font-weight:800;letter-spacing:.14em;color:var(--gold);font-size:15px;white-space:nowrap}
  .langpick{display:flex;align-items:center;gap:8px}
  .langpick label{font-size:12px;color:var(--muted)}
  select#lang{appearance:none;background:var(--panel2);color:var(--white);border:1px solid var(--line);

  .updated{color:var(--muted);font-size:14px;margin:0 0 22px}
  .intro{font-size:16px;margin:0 0 26px}
  h2{color:var(--gold);font-size:19px;margin:34px 0 10px;font-weight:700;padding-top:18px;border-top:1px solid var(--line)}
  p{margin:0 0 14px}
  ul{margin:0 0 14px;padding-inline-start:22px}
  li{margin:0 0 9px}
  li strong{color:var(--white)}
  footer.foot{color:var(--muted);font-size:14px;margin-top:44px;padding-top:18px;border-top:1px solid var(--line)}
  html[dir="rtl"] body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif}

      intro: "Ruta Travels („Ruta Travels“, „wir“, „uns“ oder „unser“) hat die Ruta-Travels-App als kommerziellen Dienst entwickelt. Diese Richtlinie erklärt, welche Informationen die App verarbeitet, wo sie gespeichert sind und in welchen wenigen Fällen sie dein Gerät verlassen.",

/* ── Engine (shared pattern with the user guide) ── */
const RTL_LANGS = ['ar'];
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function linkify(s){ return s.replace(/privacy@rutatravels\.com/g,'<a href="mailto:privacy@rutatravels.com">privacy@rutatravels.com</a>'); }
function pick(lang){ return (POLICY[lang] ? lang : 'en'); }

function renderBlocks(blocks){
  return blocks.map(b=>{
    const t=b[0];
    if(t==='p') return '<p>'+linkify(esc(b[1]))+'</p>';
    if(t==='ul') return '<ul>'+b[1].map(li=>'<li>'+linkify(esc(li))+'</li>').join('')+'</ul>';
    if(t==='dl') return '<ul>'+b[1].map(pair=>'<li><strong>'+esc(pair[0])+':</strong> '+linkify(esc(pair[1]))+'</li>').join('')+'</ul>';
    return '';
  }).join('');
}

function render(lang){
  lang=pick(lang);
  const L=POLICY[lang], EN=POLICY.en;
  const m=L.meta||EN.meta;
  document.documentElement.lang=lang;
  document.documentElement.dir=RTL_LANGS.includes(lang)?'rtl':'ltr';
  $('#pageTitle').textContent=m.title;
  $('#pageUpdated').textContent=m.updated;
  $('#pageIntro').textContent=m.intro;
  $('#pageFooter').textContent=m.footer;
  const secs=(L.sections&&L.sections.length)?L.sections:EN.sections;
  $('#content').innerHTML=secs.map(s=>'<section><h2>'+esc(s.h)+'</h2>'+renderBlocks(s.blocks)+'</section>').join('');
}

function buildLangMenu(current){
  const sel=$('#lang');
  sel.innerHTML=Object.keys(POLICY).map(code=>{
    const name=(POLICY[code].meta&&POLICY[code].meta.langName)||code;
    return '<option value="'+code+'"'+(code===current?' selected':'')+'>'+esc(name)+'</option>';
  }).join('');
  const labels={en:'Language',es:'Idioma',it:'Lingua',fr:'Langue',de:'Sprache',ja:'言語',ar:'اللغة',zh:'语言',pt:'Idioma'};
  $('#langLabel').textContent=labels[current]||'Language';
}

function detectLang(){
  const url=new URLSearchParams(location.search).get('lang');
  if(url&&POLICY[url]) return url;                                   // 1. explicit ?lang from app/guide
  try{ const s=localStorage.getItem('rutaLang'); if(s&&POLICY[s]) return s; }catch(e){} // 2. shared saved choice
  const navs=(navigator.languages||[navigator.language||'en']);      // 3. phone/browser language
  for(const n of navs){ const two=String(n).slice(0,2).toLowerCase(); if(POLICY[two]) return two; }
  return 'en';                                                        // 4. fallback
}

function setLang(lang){
  lang=pick(lang);
  buildLangMenu(lang);
  render(lang);
  try{ localStorage.setItem('rutaLang', lang); }catch(e){}
}

document.addEventListener('DOMContentLoaded', ()=>{
  setLang(detectLang());
  $('#lang').addEventListener('change', e=> setLang(e.target.value));
});
</script>
